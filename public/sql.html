<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TXAPILOG · SQL</title>
<style>body{background:#1E3A8A;color:#fff;font-family:system-ui;padding:20px;text-align:center}button{background:#FFC20E;border:0;color:#0B1B4D;font-size:18px;font-weight:700;padding:16px 20px;border-radius:14px;width:100%;max-width:420px;margin:6px 0}button.ok{background:#1f8a4c}p{color:#ccc}#s{margin:14px 0;font-size:17px}</style></head>
<body><h2>TXAPILOG · SQL do Supabase</h2>
<p>O SQL está dividido em partes pequenas para o telemóvel não bloquear.<br>Para <b>cada parte, por ordem</b>:<br>1. Toca em "Copiar parte N".<br>2. No Supabase SQL Editor, apaga o que lá estiver, cola e toca em <b>Run</b>.<br>3. Espera "Success" e passa à parte seguinte.</p>
<div id="s">A carregar…</div><div id="parts"></div>
<script>
const MAX=12000;let parts=[];
fetch('https://raw.githubusercontent.com/anamaulele4-creator/game-hub/main/supabase/schema.sql?'+Date.now()).then(r=>r.text()).then(x=>{
  const lines=x.split('\n');const secs=[];let cur=[];
  for(let i=0;i<lines.length;i++){const l=lines[i];
    if(/^-- \d+(\.\d+)?\.? /.test(l)&&cur.length){
      // move a preceding "-- ====" line into the new section
      let carry=[];while(cur.length&&/^-- =+\s*$/.test(cur[cur.length-1]))carry.unshift(cur.pop());
      secs.push(cur.join('\n'));cur=carry;}
    cur.push(l);}
  if(cur.length)secs.push(cur.join('\n'));
  let p='';for(const s of secs){if(p&&(p.length+s.length)>MAX){parts.push(p);p='';}p+=(p?'\n':'')+s;}
  if(p)parts.push(p);
  const box=document.getElementById('parts');
  parts.forEach((t,i)=>{const b=document.createElement('button');b.textContent='Copiar parte '+(i+1)+' de '+parts.length;
    b.onclick=async()=>{try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
      b.classList.add('ok');b.textContent='✅ Parte '+(i+1)+' copiada';document.getElementById('s').textContent='Cola a parte '+(i+1)+' no SQL Editor e toca em Run.'};
    box.appendChild(b)});
  document.getElementById('s').textContent='Pronto: '+parts.length+' partes';
});
</script></body></html>
